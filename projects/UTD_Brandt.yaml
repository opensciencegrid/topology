Department: School of Economic, Political and Policy Sciences
Description: "This project contributes to the computerized extraction of conflict\
  \ event data at a global scale. Most conflict event data are expensively coded by\
  \ humans from news reports. This project relies on recent advances in artificial\
  \ intelligence (AI) and large language models (LLM) to address that problem, and\
  \ builds on earlier NSF efforts that created a publicly available large language\
  \ model to study inter- and intra-state conflict, called ConfliBERT (Hu et al.,\
  \ 2022). This project expands ConfliBERT to multilingual settings, including Arabic\
  \ and Spanish. It also focuses on creating network data for individuals, groups,\
  \ locations, and events. This project will also build a research community to foster\
  \ training, education, and outreach with groups at local, national, and international\
  \ levels, including academia and government. Ultimately, our work can help researchers\
  \ and policymakers better understand conflict in foreign locations with high accuracy\
  \ and in real time.\n\nThis website also includes information about our past NSF-funded\
  \ real-time and historical event data API project entitled \u201CModernizing Political\
  \ Event Data for Big Data Social Science Research,\u201D which led to the creation\
  \ of event data on political and social events around the globe to better understand\
  \ the complex dynamics of international relations and civil conflict. The data provide\
  \ deep spatial and temporal coverage for events that affect regional, national,\
  \ and international domains, and are drawn from multiple language sources and made\
  \ freely available within hours of the events occurring. We also provide the software\
  \ and methodologies needed to analyze the data (please see the Research Papers page\
  \ for more information)."
