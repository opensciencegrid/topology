Department: Biostatistics and Computational Biology
Description: 'I develop robust EM algorithms for linear mixed-effects models fitted
  to sparse, irregularly sampled longitudinal data the setting where many subjects
  have fewer observations than the model has random effects, so each subject''s random
  effect is only partially identified and conventional outlier diagnostics have little
  power. Validating the method requires large simulation studies: independent replicate
  datasets crossed over contamination scenarios, contamination levels, study designs,
  and competing estimators, with each cell an independent single-core R fit.'
