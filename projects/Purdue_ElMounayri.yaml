Department: Mechanical Engineering Department in Indianapolis
Description: Studying continual learning for AI agents - how an agent can detect and
  repair its own tools when the software libraries and APIs it depends on change silently.
  The experiments test repair and verification methods on a benchmark of real library-drift
  episodes, which needs thousands of short, independent CPU-only runs across seeds
  and method variants.
