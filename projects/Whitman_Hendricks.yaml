Department: Chemistry Department
Description: Our research is focused on understanding the pathways of formation of
  inorganic nanocrystals, including both semiconducting and metallic nanocrystals.
  We are using UV-Vis spectroscopy to study the formation of metallic nanoparticles
  using a high-throughput automated system, and using computational studies to help
  understand how the UV-vis spectra correlate with shape and size of the particles,
  with more information available at https://www.whitman.edu/academics/majors-and-programs/chemistry/faculty-and-staff/mark-hendricks
