Department: Department of Statistics
Description: My research lies at the intersection of machine learning and modern statistics,
  with an emphasis on high-dimensional inference, dependent data, neural networks,
  and structured learning problems. Current projects develop statistical and computational
  methods for large language models and transformers, including generalization, reasoning,
  representation geometry, retrieval, and efficient learning. I also study changepoint
  detection, networks, time series, and spatiotemporal data, with a focus on scalable
  methodology for high-dimensional and large-scale datasets. These projects combine
  statistical theory with computationally intensive experiments on modern ML models,
  requiring substantial parallel CPU and GPU resources. https://sayarkarmakar.github.io/
