Department: Biology
Description: 'We use an integrative approach to understanding behavioral variation.
  More specifically, we are interested in understanding the mechanisms underlying
  stress coping styles and their impact on learning and memory processes, as well
  as stress and anxiety. Our principles and methodologies range from behavioral ecology,
  neuroethology, molecular neuroscience, and bioinformatics to study behavioral variation.'
