Department: Astronomy
Description: We will build a self-consistent, spatially resolved framework that predicts
  galaxy emission lines from rest-frame optical to the far-infrared by coupling cosmological
  radiation-hydrodynamics simulations to photoionization and 3D dust radiative transfer.
  Applied across all simulated galaxies and timesteps and extended to a larger volume
  simulation (IllustrisTNG) to directly sample dusty starforming galaxy analogs over
  their evolution, this framework will generate a library of resolved synthetic spectra
  and photometry used to train a neural network that infers star formation histories
  from observed spectra and photometry.
