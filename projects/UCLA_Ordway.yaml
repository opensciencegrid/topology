Department: Ecology and Evolutionary Biology
Description: 'Our research examines terrestrial social-ecological systems in the context
  of two globally pressing challenges: climate change and increasing demands for land
  to accommodate food, fuel, and fiber production for over 8 billion people. How we
  choose to address these challenges will have far-reaching impacts on ecological
  processes, biodiversity, and society. Combining remote sensing, field observations,
  models, and socioeconomic analyses, we integrate theory and methods from ecology,
  earth science, economics, and land system science to gain new insight into pattern
  and process across scales in forest ecosystems in the context of global environmental
  change.'
