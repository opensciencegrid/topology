Department: Astronomy Department
Description: VPLanet is software to simulate planetary system evolution, with a focus
  on habitability. Physical models, typically consisting of ordinary differential
  equations, are coupled together to simulate evolution, from planetary cores to passing
  stars, for the age of a system.
