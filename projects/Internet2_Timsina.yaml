Department: MS-CC
Description: 'MS-CC aims to strengthen cyberinfrastructure for research and education
  across a wide range of fields and communities, taking into account the education,
  research, and service missions of our institutions. This project provides dedicated,
  hands-on guidance to MS-CC member institutions specifically HBCUs, TCUs, and MSIs
  to streamline the process of discovering, applying for and utilizing ACCESS resources.


  Despite the availability of cyberinfrastructure resources nationally, many smaller  institutions
  lack the technical expertise required to navigate the initial onboarding, workflow
  optimization, and allocation request processes.By offering tailored technical support,
  this program aims to lower the barrier to use the HPC/HTC resources, empowering
  faculty, researchers and students to accelerate their data-intensive scientific
  discoveries'
