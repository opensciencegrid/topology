Department: Physics
Description: We study nonlinear mode coupling in pulsating Delta Scuti stars to understand
  what limits their oscillation amplitudes. Using stellar models (MESA) and their
  oscillation modes (GYRE), we integrate large networks of coupled mode-amplitude
  equations across many stellar models and parameter sets, which means many independent
  single-core jobs.
