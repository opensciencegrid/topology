Department: Computer Sciences
Description: The goal of my research is to create intelligent agents---robots and
  software systems---that learn to make decisions on their own---improving through
  experience rather than following fixed logic. Toward this goal, my work primarily
  focuses on reinforcement learning (RL) and spans algorithm design and applications,
  particularly in robotics.
