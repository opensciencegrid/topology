Department: Physics
Description: "Our group focuses on quantum information. Preskill\u2019s research group\
  \ operates within the Institute for Quantum Information and Matter (IQIM) at Caltech,\
  \ an NSF Physics Frontiers Center descended from the Institute for Quantum Information\
  \ (IQI). The group\u2019s research addresses the theory of quantum information and\
  \ computation, with emphasis on quantum error correction and fault tolerance \u2014\
  \ schemes for protecting quantum systems from decoherence \u2014 alongside connections\
  \ between quantum information and fundamental physics, including quantum field theory\
  \ simulation, spacetime, and the black hole information problem.  More details found\
  \ here, https://iqim.caltech.edu/"
