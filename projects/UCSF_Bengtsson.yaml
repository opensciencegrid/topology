Department: Department of Epidemiology and Biostatistics
Description: I develop the Futureverse (https://www.futureverse.org), a set of open-source
  R packages for parallel and distributed processing that many R packages and data
  analysts depend on. This project adds HTCondor support to the parallelly package
  (https://parallelly.futureverse.org), so that R code running on the OSPool uses
  the number of CPU cores requested via request_cpus, rather than detecting all cores
  on the machine. My own background is in bioinformatics, genetics, cancer research,
  and applied statistics.
