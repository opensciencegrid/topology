Department: Department of Economics
Description: This research conducts empirical analysis in international trade focusing
  on gravity models with high-dimensional fixed effects and instrumental variables.
  We require high-performance computing on the OSPool to run intensive resampling
  methods, including bootstrap and jackknife bias-correction algorithms, across large
  panel datasets. (https://ideas.repec.org/p/drx/wpaper/202611.html)
