Department: Astronomy
Description: ince the data from Kepler, compact multiplanetary systems have been known
  as a common stellar system architecture. These systems often exhibit a "peas-in-a-pod"
  type architecture with planets evenly spaced in period and roughly the same time.
  Some systems, however, have a dynamical gap disrupting the otherwise regular pattern
  of planet placement. We hypothesize these gaps could be caused by undetected binary
  planets and will be performing N-body rebound simulations to determine whether such
  planets are dynamically stable.
