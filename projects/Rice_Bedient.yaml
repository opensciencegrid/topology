Department: Civil & Environmental Engineering, SSPEED Center (Severe Storm Prediction,
  Education, and Evacuation from Disasters)
Description: I research the role of infiltration in flood risk evaluation through
  deterministic, physics-based modeling and complementary Bayesian statistical modeling,
  with an emphasis on natural processes and the potential benefit of nature-based
  solutions. I am currently evaluating traditional hydrologic and hydraulic models
  like HEC-HMS/HEC-RAS vs. experimental GPU-enabled models using simplified diffusive
  wave solvers on cartesian grids in Julia. My research helps quantify the benefit
  provided by natural systems and engineered systems to mimic those benefits for a
  reduction in flood hazard across Houston-area watersheds with an emphasis on multi-layer
  soil processes, whereas traditional approaches take minimum values irrespective
  of soil horizon differences. https://sspeed.rice.edu/
