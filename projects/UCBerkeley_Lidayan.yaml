Department: Center for Human-Compatible Artificial Intelligence
Description: We study whether learning representations at multiple levels of abstraction
  can help AI systems plan over longer horizons. Our approach builds on joint-embedding
  predictive architectures (JEPA), which learn from unlabeled observations by predicting
  future representations rather than individual pixels.
