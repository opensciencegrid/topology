Department: Physics and Engineering
Description: We are interested in the exploration of novel quantum and energy materials,
  particularly those of thermoelectrics, topological insulators, magnetocaloric effect,
  high entropy alloys, and magnetic materials. By studying these systems, we aim to
  discover tunable functionalities for next-generation energy conversion, solid-state
  cooling, spintronic technologies, etc. We are also interested in the studies that
  provide an understanding of material-tissue interactions and nanoscale systems for
  biomedical and life-science applications.
