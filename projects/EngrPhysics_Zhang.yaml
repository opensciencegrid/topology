Department: Nuclear Engineering & Engineering Physics
Description: Taking a multiscale, microstructure-based modeling approach, we will
  i) uncover the fundamental mechanisms that are responsible for materials degradation,
  ii) develop materials models to predict the in-service degradation rates of materials
  in harsh environment, and iii) aid in development of advanced materials with improved
  performance in harsh environments.
