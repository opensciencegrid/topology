Department: Department of Civil and Environmental Engineering
Description: This research investigates how temporal resolution and model fidelity
  affect decision-making in adaptive facade control systems. High-fidelity daylight
  and glare simulations using Radiance and evalglare are conducted to evaluate control
  performance and identify computationally efficient strategies that maintain visual
  comfort and building energy performance.
