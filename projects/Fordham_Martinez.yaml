Department: Department of Psychology
Description: 'I am a quantitative psychologist and my research is focused on the development
  and application of statistical algorithms (primarily Bayesian) for cognitive diagnosis
  models and other psychometric/latent variable models. Most of my computational work
  involves evaluating the performance of these algorithms via simulation studies under
  conditions common in education and psychological research. I am the Director of
  The PRISM Lab at Fordham University (https://www.theprismlab.ajmquant.com/) which
  is dedicated to the development of quantitative and statistical methods and their
  applications to the social and behavioral sciences. The PRISM lab conducts research
  in the following subject areas: Generalized latent variable and psychometric modeling
  (e.g., generalized structural equation models, cognitive diagnosis models, factor
  analysis, item response theory); Bayesian inference, modeling, and prediction; Mixture
  modeling; Measurement invariance, adaptive testing, and psychological/educational
  measurement; Estimation theory for psychometric and generalized latent variable
  models; Multilevel and longitudinal modeling; Computational statistics as applied
  the psychological, behavioral, and social sciences.'
