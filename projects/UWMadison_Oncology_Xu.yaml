Department: Department of Oncology
Description: My laboratory is focused on the transcriptional regulation of estrogen
  receptor (ER) signaling pathways by nuclear receptor co-factors. The second focus
  of our lab is to elucidate epigenetic regulation of cell signaling and transcription
  by CARM1-mediated methylation of histone and non-histone substrates, and to reveal
  how arginine methylation contributes to diverse biological functions.
