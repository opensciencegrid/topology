Department: Mechanical and Aerospace Engineering at David A. Duffield College of Engineering
Description: "This project builds a three-dimensional, agent-based simulation of the\
  \ filamentous fungus Neurospora crassa in the BoltzmannMFX framework, with every\
  \ parameter grounded in the experimental literature, to faithfully reproduce how\
  \ a real colony grows. We've implemented and validated the core biology piece by\
  \ piece \u2014 intra-hyphal transport as a pressure-driven network, growth bounded\
  \ by starvation death, saturating metabolic kinetics, and an intrinsic mitochondrial-damage\
  \ aging mechanism \u2014 holding throughout to the principle that each mechanism\
  \ must replicate the real biology rather than be tuned to make the output look right.\
  \ The ultimate goal is a trustworthy growth model that can later carry a simulation\
  \ of the electrical signaling patterns filamentous fungi use to communicate."
