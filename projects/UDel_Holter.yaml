Department: Department of Economics
Description: I am researching how grid scale battery storage affects investment in
  solar and wind, electricity prices, and welfare. I build a deployment model for
  the electricity grid, and an investment model for optimal investment in generation
  technologies as well as entry based on profit motive. This model is solved over
  a 100 year time horizon, and under different policy counterfactuals.
