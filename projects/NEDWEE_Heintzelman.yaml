Department: Nebraska Dept. of Energy, Water, and Environment
Description: We use Modflow (an open-source ground and surface water modeling program)
  to assess the impact of water management practices on stream flow and aquifer levels.
  We model various scenarios, but at the moment our focus is on refining our understanding
  of hydrologically-connected areas around the state's river basins.
