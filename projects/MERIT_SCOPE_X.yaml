Department: R&D
Description: 'SCOPE-X (Scalable Cyberinfrastructure for Observatory Pipeline Enhancement)
  advances the cyberinfrastructure of ORION (Observatory for Cyber-Risk Insights and
  Outages of Networks), one of the oldest and largest operational network telescopes
  in the United States, operated by Merit Network. ORION provides visibility into
  unsolicited and potentially malicious Internet traffic and supports shared cybersecurity
  research through both its live traffic feed and its 20-year archive. Rising traffic
  volumes, extreme bursts, and evolving attack behaviors require transformation of
  the end-to-end pipeline to preserve data fidelity, operational reliability, and
  long-term usability.

  https://www.nsf.gov/awardsearch/show-award/?AWD_ID=2612015'
