Department: Department of Bioengineering and Therapeutic Sciences
Description: The postsynaptic density (PSD) is a phase-separated assembly of hundreds
  of proteins that organizes excitatory synaptic signaling, and its dysregulation
  underlies many neurodevelopmental disorders, including autism. Ensembles of all-atom
  and coarse-grained molecular dynamics simulations (~10,000 GPU hours) will be run
  on key PSD proteins and their complexes, such as SynGAP1, PSD-95, and their binding
  partners, to characterize how wild-type, pathogenic variant, and phosphorylated
  forms differ in structure, stability, and condensate formation. The resulting models
  will be integrated into multiscale structural models of the PSD using the open-source
  Integrative Modeling Platform (https://integrativemodeling.org) and deposited in
  public databases for community use.
