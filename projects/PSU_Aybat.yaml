Department: Industrial and Manufacturing Engineering Department
Description: My research focuses on developing efficient optimization algorithms for
  large-scale problems arising in machine learning, data science, and distributed
  computing. In particular, my work involves convex and nonconvex optimization, stochastic
  minimax optimization, primal-dual methods, and decentralized optimization algorithms.
  A significant component of my research involves extensive numerical experiments
  to evaluate algorithmic performance, validate theoretical convergence guarantees,
  and compare newly developed methods with existing approaches. These experiments
  include both CPU- and GPU-based computations, often requiring hundreds or thousands
  of independent runs across different problem instances, parameter settings, and
  random seeds. Please see https://nsaybat.org/pubs.html
