Department: Department of Biostatistics & Medical Informatics
Description: Jiwei Zhao's research focuses on applying semiparametric techniques to
  understand the complex structure of modern biomedical data sets, usually in the
  pursuit of efficiency, robustness, and the tradeoff between the two. Specifically,
  his work has concentrated in the fields of distribution shift, domain adaptation
  and transfer learning; weakly supervised machine learning; missing data analysis
  and causal inference. He also conducts research on developing trustworthy statistical
  inference methods for AI-predicted data and, more broadly, for synthetic data, with
  a focus on reliability, robustness, and principled uncertainty quantification.
