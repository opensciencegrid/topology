Department: Columbia Population Research Center
Description: "The Columbia Population Research Center supports population health researchers\
  \ across Columbia University, galvanizing new interdisciplinary and cross-campus\
  \ collaborations. Our members\u2019 interests encompass five primary research areas:\
  \ Children, Youth, and Families; Climate and Environment; Immigration/Migration;\
  \ Reproductive Health and HIV/AIDS; and Urbanism and Neighborhoods, with cross-cutting\
  \ attention to inequalities and policies to mitigate those inequalities."
