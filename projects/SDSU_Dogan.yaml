Department: Physics
Description: Our research focuses on the computational discovery of high-temperature
  superconductors, particularly hydrogen-rich materials under high pressure. We are
  developing an automated high-throughput platform combining Quantum ESPRESSO, machine-learning
  interatomic potentials, and electronic-structure screening to identify promising
  superconducting candidates.
