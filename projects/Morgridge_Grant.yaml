Department: Department of Biochemistry
Description: The main research focus of the lab is the development of methods for
  single-particle cryo electron microscopy (cryo-EM), a technique for determining
  the structure of biological molecules.  In this technique, many hundreds of thousands
  to millions of images of molecules are taken on an electron microscope. By combining
  all of the information from these images using image processing techniques, it is
  possible to visualize the detailed atomic structure of the molecules. This allows
  us to gain a deeper understanding of how they work, and can be used to design new
  drugs to target these molecules and ultimately provide therapeutic treatment for
  disease.  As part of these efforts, we develop cisTEM, a software package containing
  a complete workflow for processing single-particle cryo-EM images within a user-friendly
  interface. https://morgridge.org/research/labs/grant/
