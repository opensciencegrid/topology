Department: Computer Sciences
Description: Research in the WiNGS lab is conducted in the areas of networking and
  distributed systems, with a primary focus on wireless and mobile networking. Research
  activities in the lab span a diverse set of activities, ranging from algorithmic
  design and analysis, and systems building through functional prototypes. Our projects
  get deployed in real and practical scenarios, sometimes in collaboration with partners
  who allow us to understand various real constraints, leading in turn to more refined
  solutions.
