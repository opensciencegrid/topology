Department: Biostatistics and Medical Informatics
Description: Dr. Pimentel-Alarcon's research focuses on developing theory and algorithms
  to learn from messy data - that is, data with outliers, missing values, noise, sparsity
  patterns, unbalanced classes, small sample size, etc. I investigate both, the fundamental
  limits of how messy can data be so that we can still learn from it, and the practical
  algorithms that we can use to learn from such messy data. To these ends, I use techniques
  from optimization, signal processing, algebraic geometry, machine learning, and
  more. This research is motivated by a wide range of applications ranging from biomedicine
  to astronomy.
