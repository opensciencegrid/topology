Department: Physics and Astronomy
Description: 'This project develops and validates a non-perturbative rate theory for
  reverse intersystem crossing in the organic emitters used in OLED displays. In these
  materials the spin-flip that recycles dark triplet excitons into emissive singlets
  is spin-vibronic: spin-orbit coupling to one triplet is mediated by nonadiabatic
  coupling to a second triplet through a vibrational mode.'
