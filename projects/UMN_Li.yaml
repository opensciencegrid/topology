Department: School of Statistics
Description: My PhD dissertation focuses on privacy-preserving transfer learning methods
  for multi-site electronic health record (EHR) data. The research involves developing
  and evaluating statistical methods that leverage information across institutions
  while accounting for site-specific heterogeneity and data-sharing constraints. I
  plan to use OSPool to conduct large-scale simulation studies evaluating the proposed
  methods against existing benchmarks across different experimental settings.
