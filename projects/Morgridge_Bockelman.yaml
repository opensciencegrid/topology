Department: Research Computing
Description: "Bockelman's group works to advance the state of the art of
  Throughput Computing as part of the Center for High Throughput Computing
  (CHTC), split between Morgridge and UW-Madison.  The CHTC develops software,
  the HTCondor Software Suite and Pelican, for managing compute and data workloads,
  respectively, and practices Translational Computer Science through the operations
  of OSG Consortium services.

  Activities this project support include collaborating with other researchers to
  explore how distributed HTC can impact their science and to test new services and
  methodologies."
