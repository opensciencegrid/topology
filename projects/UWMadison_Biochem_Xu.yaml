Department: Biochemistry
Description: The Xu Lab is broadly interested in understanding the protein-protein
  interactions at the host-pathogen interface. We take a protein engineering approach,
  in combination with biochemistry, structural biology and immunology, to identify
  new classes of antibodies and design principles to manipulate immunogenicity. The
  long-term goal is to identify new targets and design principles for designing vaccines
  and therapeutics, especially against important infectious diseases with unmet human
  needs.
